name: Build Release Learning Lab

on:
  push:
    branches: [ main ]
    paths:
      - "build-release-lab/**"
      - ".github/workflows/build_release_learning_lab.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "build-release-lab/**"
      - ".github/workflows/build_release_learning_lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC Debug
            os: ubuntu-22.04
            compiler: g++
            build_type: Debug
          - name: Ubuntu GCC Release
            os: ubuntu-22.04
            compiler: g++
            build_type: Release
          - name: Ubuntu Clang Debug
            os: ubuntu-22.04
            compiler: clang++
            build_type: Debug
          - name: Windows MSVC Debug
            os: windows-2022
            compiler: msvc
            build_type: Debug
          - name: Windows MSVC Release
            os: windows-2022
            compiler: msvc
            build_type: Release
          - name: macOS Clang Release
            os: macos-14
            compiler: clang++
            build_type: Release

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Runner and CMake information
        run: |
          git --version
          cmake --version

      - name: Compiler information
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "msvc" ]; then
            echo "MSVC is supplied by the Windows runner."
          else
            ${{ matrix.compiler }} --version
          fi

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "msvc" ]; then
            cmake -S build-release-lab -B build-release-lab/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          else
            cmake -S build-release-lab -B build-release-lab/build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          fi

      - name: Build
        run: cmake --build build-release-lab/build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build-release-lab/build -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload CMake cache if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-cache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: build-release-lab/build/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Pipeline summary
    runs-on: ubuntu-22.04
    needs: [ build-and-test ]
    if: always()
    steps:
      - name: Report result
        run: |
          echo "Build matrix result: ${{ needs.build-and-test.result }}"
          test "${{ needs.build-and-test.result }}" = "success"
